# ==============================================================================
# Pillayar Nonbu 2026 — Event Plan Data
# ==============================================================================
# Source data for eplan.html.
# After editing this file, regenerate eplan.html by running:
#   python3 build_eplan.py
#
# Structure:
#   1. families     - Column order, display names, filter labels, and CSS themes.
#   2. schedule     - Time-slot grid mapped by family key (aswin, hari, ...).
#   3. action_items - Action items and bring checklists mapped by family key.
# ==============================================================================

title: Pillayar Nonbu — Organizer Task Assignments
subtitle: 6 Families + Aachis | Schedule | Action Items

# ==============================================================================
# 1. FAMILIES (column order from left to right)
# ==============================================================================
# - id:           Key used in `schedule` and `action_items` below.
# - name:         Full column header displayed in the table.
# - short_name:   Label shown on the mobile/top filter pill buttons.
# - header_class: CSS color theme class (h-f1..h-f6, h-aachi).
families:
  - id: aswin
    name: Aswin & Chitra
    short_name: Aswin
    header_class: h-f4    # Purple theme

  - id: hari
    name: Hari & Srilaxmi
    short_name: Hari
    header_class: h-f6    # Cyan theme

  - id: karthik
    name: Karthik & Janani
    short_name: Karthik
    header_class: h-f3    # Green theme

  - id: senthil
    name: Senthil & Abi
    short_name: Senthil
    header_class: h-f2    # Blue theme

  - id: thiru
    name: Thiru & Unna
    short_name: Thiru
    header_class: h-f5    # Pink theme

  - id: muthu
    name: Muthu & Meena
    short_name: Muthu
    header_class: h-f1    # Orange theme

  - id: aachis
    name: Aachis
    short_name: Aachis
    header_class: h-aachi # Yellow theme

